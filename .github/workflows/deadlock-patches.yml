# Kommt ins Repo "afterlight-releases" unter .github/workflows/deadlock-patches.yml.
# Prueft alle 30 Minuten die offiziellen Deadlock-Patchnotes (ueber die Deadlock-API) und postet neue in #deadlock-patches.
# Benoetigt: Secret DISCORD_WEBHOOK_PATCHES, optional Variable DISCORD_ROLE_PATCHES (Rollen-ID fuer den Ping).
name: Deadlock patch notes

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      post_latest:
        description: 'Neuesten Patch sofort posten (Test)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency: deadlock-patches

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - name: Letzten erfolgreichen Lauf bestimmen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/deadlock-patches.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // ""' > since.txt
          echo "Seit: $(cat since.txt)"

      - name: Neue Patches posten
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_PATCHES }}
          ROLE: ${{ vars.DISCORD_ROLE_PATCHES }}
          POST_LATEST: ${{ inputs.post_latest }}
        run: |
          cat > patches.mjs <<'EOF'
          import fs from 'node:fs';
          if (!process.env.HOOK) { console.error('Secret DISCORD_WEBHOOK_PATCHES fehlt.'); process.exit(1); }
          const res = await fetch('https://api.deadlock-api.com/v1/patches', { headers: { 'User-Agent': 'AFTERLIGHT-Discord' } });
          if (!res.ok) { console.log('Deadlock-API nicht erreichbar:', res.status); process.exit(0); }
          const id = p => Number(/thread:(\d+)/.exec(p.guid?.text || '')?.[1] || /\.(\d+)\/?$/.exec(p.link || '')?.[1] || 0);
          const all = (await res.json()).filter(p => p.title && p.link && id(p)).sort((a, b) => id(a) - id(b));
          const raw = fs.readFileSync('since.txt', 'utf8').trim();
          // Erster Lauf ohne Vorgaenger: nur die letzte Stunde zaehlt als neu
          const since = Date.parse(raw) || Date.now() - 3600_000;
          // Bereits bekannt = alles, was vor dem letzten Lauf veroeffentlicht war. Neu = hoehere Thread-ID.
          // So loesen nachtraeglich bearbeitete alte Patches keinen erneuten Post aus.
          const known = Math.max(0, ...all.filter(p => Date.parse(p.pub_date) <= since).map(id));
          let fresh = all.filter(p => id(p) > known && Date.parse(p.pub_date) > since).slice(-3);
          if (process.env.POST_LATEST === 'true') fresh = all.slice(-1);
          if (!fresh.length) { console.log('Keine neuen Patches.'); process.exit(0); }
          const text = html => html.replace(/<br\s*\/?>/gi, '\n').replace(/<li[^>]*>/gi, '\n• ').replace(/<[^>]+>/g, '')
            .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#0?39;/g, "'")
            .replace(/[ \t]+/g, ' ').replace(/^ +| +$/gm, '').replace(/\n\s*\n+/g, '\n').trim();
          for (const p of fresh) {
            let body = text(p.content_encoded || '');
            if (body.length > 1500) body = body.slice(0, 1500).replace(/\n[^\n]*$/, '') + '\n…';
            const msg = {
              content: process.env.ROLE ? `<@&${process.env.ROLE}>` : undefined,
              allowed_mentions: { roles: process.env.ROLE ? [process.env.ROLE] : [] },
              embeds: [{ color: 0xfb7185, author: { name: 'Deadlock · Patch notes' }, title: p.title.slice(0, 250), url: p.link,
                description: `${body}\n\n**[Read the full patch notes →](${p.link})**`, footer: { text: p.dc_creator ? `by ${p.dc_creator} · playdeadlock.com` : 'playdeadlock.com' }, timestamp: p.pub_date }],
            };
            const r = await fetch(process.env.HOOK + '?wait=true', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });
            if (!r.ok) { console.error('Discord', r.status, await r.text()); process.exit(1); }
            console.log('Gepostet:', p.title);
          }
          EOF
          node patches.mjs
