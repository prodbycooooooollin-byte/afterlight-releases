# Kommt ins Repo "afterlight-releases" unter .github/workflows/deadlock-patches.yml.
# Prueft alle 30 Minuten die offiziellen Deadlock-Ankuendigungen von Valve auf Steam (Updates, Patches) und postet neue in #deadlock-patches.
# Benoetigt: Secret DISCORD_WEBHOOK_PATCHES, optional Variable DISCORD_ROLE_PATCHES (Rollen-ID fuer den Ping).
name: Deadlock patch notes

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      post_latest:
        description: 'Neuesten Patch sofort posten (Test)'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency: deadlock-patches

jobs:
  patches:
    runs-on: ubuntu-latest
    steps:
      - name: Letzten erfolgreichen Lauf bestimmen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/workflows/deadlock-patches.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].created_at // ""' > since.txt
          echo "Seit: $(cat since.txt)"

      - name: Neue Patches posten
        env:
          HOOK: ${{ secrets.DISCORD_WEBHOOK_PATCHES }}
          ROLE: ${{ vars.DISCORD_ROLE_PATCHES }}
          POST_LATEST: ${{ inputs.post_latest }}
        run: |
          cat > patches.mjs <<'EOF'
          import fs from 'node:fs';
          if (!process.env.HOOK) { console.error('Secret DISCORD_WEBHOOK_PATCHES fehlt.'); process.exit(1); }
          // Offizielle Deadlock-Ankündigungen von Valve auf Steam (Updates, Patches, neue Helden). App-ID 1422450.
          const res = await fetch('https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/?appid=1422450&count=15&maxlength=0&feeds=steam_community_announcements&format=json', { headers: { 'User-Agent': 'AFTERLIGHT-Discord' } });
          if (!res.ok) { console.log('Steam-News nicht erreichbar:', res.status); process.exit(0); }
          const all = ((await res.json())?.appnews?.newsitems || []).filter(n => n.title && n.gid).sort((a, b) => a.date - b.date);
          const raw = fs.readFileSync('since.txt', 'utf8').trim();
          // Erster Lauf ohne Vorgaenger: nur die letzte Stunde zaehlt als neu. Neu = nach dem letzten erfolgreichen Lauf veroeffentlicht.
          const since = (Date.parse(raw) || Date.now() - 3600_000) / 1000;
          let fresh = all.filter(n => n.date > since).slice(-3);
          if (process.env.POST_LATEST === 'true') fresh = all.slice(-1);
          if (!fresh.length) { console.log('Keine neuen Ankündigungen.'); process.exit(0); }
          const IMG = 'https://clan.akamai.steamstatic.com/images/';
          const image = c => { const m = /\[img(?: src=")?\{STEAM_CLAN(?:_LOC)?_IMAGE\}\/([^"\]\s]+)/i.exec(c || ''); return m ? IMG + m[1] : null; };
          const text = c => (c || '')
            .replace(/\[img[^\]]*\][\s\S]*?\[\/img\]/gi, '').replace(/\{STEAM_CLAN(?:_LOC)?_IMAGE\}\S*/g, '')
            .replace(/\[\*\]/g, '\n• ').replace(/\[h[1-6]\]([\s\S]*?)\[\/h[1-6]\]/gi, '\n**$1**\n').replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '**$1**')
            .replace(/\[url=([^\]]+)\]([\s\S]*?)\[\/url\]/gi, '[$2]($1)').replace(/\[\/?[a-z0-9*]+(?:=[^\]]*)?\]/gi, '').replace(/<[^>]+>/g, '')
            .replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#0?39;/g, "'")
            .replace(/[ \t]+/g, ' ').replace(/^ +| +$/gm, '').replace(/\n\s*\n+/g, '\n\n').trim();
          for (const n of fresh) {
            const link = `https://store.steampowered.com/news/app/1422450/view/${n.gid}`;
            let body = text(n.contents);
            if (body.length > 1500) body = body.slice(0, 1500).replace(/\n[^\n]*$/, '') + '\n…';
            const img = image(n.contents);
            const msg = {
              content: process.env.ROLE ? `<@&${process.env.ROLE}>` : undefined,
              allowed_mentions: { roles: process.env.ROLE ? [process.env.ROLE] : [] },
              embeds: [{ color: 0xfb7185, author: { name: 'Deadlock · Patch notes' }, title: n.title.slice(0, 250), url: link,
                description: `${body}\n\n**[Read the full patch notes →](${link})**`, ...(img ? { image: { url: img } } : {}),
                footer: { text: 'Valve · Steam' }, timestamp: new Date(n.date * 1000).toISOString() }],
            };
            const r = await fetch(process.env.HOOK + '?wait=true', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(msg) });
            if (!r.ok) { console.error('Discord', r.status, await r.text()); process.exit(1); }
            console.log('Gepostet:', n.title);
          }
          EOF
          node patches.mjs
